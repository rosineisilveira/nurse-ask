# app/application/rag_workflow/nemo_config/config.yml
models:
  - type: main
    engine: ollama
    model: llama3.1
    parameters:
      temperature: 0.0

  # Embedding rápido e local para bater a intenção do usuário com o arquivo .co
  # - type: embeddings
  #   engine: huggingface
  #   model: all-MiniLM-L6-v2

core:
  embedding_search_provider:
    name: fastembed
    parameters:
      embedding_model: "BAAI/bge-small-en-v1.5"

rails:
  # Ativa os rails de entrada (moderação) e diálogo (intenção)
  # input:
  #   flows:
  #     - check jailbreak
  # dialog:
  #   single_call:
  #     enabled: True
  dialog:
    user_messages:
      embeddings_only: True  # Impede o NeMo de chamar o LLM