<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NurseAsk - Assistente Clínico</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background: #0f766e; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: #e0f2fe; color: #0369a1; border-bottom-right-radius: 0; }
        .ai-msg { align-self: flex-start; background: #f1f5f9; color: #334155; border-bottom-left-radius: 0; }
        .status-text { font-size: 0.8rem; color: #64748b; margin-bottom: -10px; font-style: italic; }
        .input-area { padding: 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        button { padding: 12px 24px; background: #0f766e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">🩺 NurseAsk Engine</div>
        <div class="messages" id="chat"></div>
        <div class="input-area">
            <input type="text" id="question" placeholder="Pergunte sobre um protocolo (ex: choque anafilático)..." onkeypress="handleEnter(event)">
            <button id="sendBtn" onclick="askQuestion()">Enviar</button>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const input = document.getElementById('question');
            const btn = document.getElementById('sendBtn');
            const chat = document.getElementById('chat');
            const question = input.value.trim();
            
            if (!question) return;

            // 1. Adiciona pergunta do usuário na tela
            input.value = '';
            btn.disabled = true;
            chat.innerHTML += `<div class="message user-msg">${question}</div>`;
            
            // 2. Cria o balão da resposta da IA
            const id = Date.now();
            chat.innerHTML += `<div class="status-text" id="status-${id}">Iniciando análise...</div>`;
            chat.innerHTML += `<div class="message ai-msg" id="ai-${id}"></div>`;
            chat.scrollTop = chat.scrollHeight;

            const aiBubble = document.getElementById(`ai-${id}`);
            const statusText = document.getElementById(`status-${id}`);

           try {
                // 1. Faz a requisição POST
                const response = await fetch('http://127.0.0.1:8000/api/v1/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: "web_user_1" })
                });

                if (!response.ok) throw new Error(`Falha no servidor: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = ""; // O segredo está aqui: o buffer acumula os pacotes quebrados pela rede
                
                while (true) {
    const { done, value } = await reader.read();
    
    // Se a rede fechou a conexão antes do servidor avisar
    if (done) {
        btn.disabled = false;
        break; 
    }

    buffer += decoder.decode(value, { stream: true });
    let endOfMessage = buffer.indexOf('\n\n');
    
    while (endOfMessage !== -1) {
        let message = buffer.slice(0, endOfMessage).trim();
        buffer = buffer.slice(endOfMessage + 2);

        if (message.startsWith('data: ')) {
            const jsonString = message.substring(6).trim();

            try {
                // O SEGREDO 3: Try/Catch super restrito
                const data = JSON.parse(jsonString);
                
                if (data.type === 'done') {
                    btn.disabled = false;
                    return; // O fluxo acabou perfeitamente!
                } 
                else if (data.type === 'status') {
                    statusText.innerText = data.content;
                } 
                else if (data.type === 'token') {
                    aiBubble.innerHTML += data.content.replace(/\n/g, '<br>');
                    statusText.style.display = 'none';
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (parseError) {
                // SE O PACOTE FOR LIXO, ELE APENAS IGNORA E CONTINUA! 
                // Não vai mais estourar o erro na tela.
                console.warn("Ignorado pacote defeituoso da rede:", jsonString);
            }
        }
        endOfMessage = buffer.indexOf('\n\n');
    }
}
                
            } catch (error) {
                aiBubble.innerHTML = `⚠️ Erro de conexão: ${error.message}`;
                console.error(error);
            }
            btn.disabled = false;
        }

        function handleEnter(e) { if (e.key === 'Enter') askQuestion(); }
    </script>
</body>
</html>
